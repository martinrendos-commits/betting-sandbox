<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Sandbox{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #10141a; color: #e8edf3; }
    header { background: #1b2430; padding: 12px 20px; font-weight: 600; }
    header a { color: #8fd0ff; margin-right: 16px; text-decoration: none; }
    main { padding: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { border-bottom: 1px solid #2b3542; padding: 8px 10px; text-align: left; font-size: 14px; }
    .badge { background: #2b3542; border-radius: 4px; padding: 2px 6px; font-size: 12px; }
    .card { background: #1b2430; border: 1px solid #2b3542; border-radius: 8px; padding: 14px; margin-bottom: 12px; max-width: 900px; }
    .odds-btn { background: #24405c; color: #ffd479; border: 1px solid #35618c; border-radius: 6px;
                padding: 10px 16px; font-size: 15px; cursor: pointer; margin-right: 8px; }
    .odds-btn:hover { background: #2f5a7d; }
    .slip { position: fixed; right: 20px; top: 70px; width: 260px; background: #1b2430;
            border: 1px solid #35618c; border-radius: 8px; padding: 14px; }
    .slip input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    .submit-btn { width: 100%; padding: 10px; background: #2e7d32; color: white; border: none;
                  border-radius: 6px; font-size: 15px; cursor: pointer; }
    .muted { color: #93a1b1; font-size: 12px; }
  </style>
</head>
<body>
<header>
  <a href="/livescore/">Mock Livescore</a>
  <a href="/book/live">Mock Bookmaker</a>
  <span class="muted">lokálny sandbox – žiadne reálne peniaze, žiadna reálna stávková kancelária</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
